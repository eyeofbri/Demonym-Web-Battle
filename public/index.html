<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Demonym Connect</title>

		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				background: #111;
				color: #fff;
				font-family: monospace;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			main {
				width: min(760px, calc(100% - 32px));
				padding: 24px 0;
			}

			h1,
			h2,
			p {
				margin-top: 0;
			}

			button,
			input {
				font: inherit;
				padding: 10px 14px;
			}

			button {
				cursor: pointer;
			}

			button:disabled {
				cursor: not-allowed;
				opacity: 0.45;
			}

			.lobby {
				display: grid;
				gap: 16px;
			}

			.join {
				display: flex;
				gap: 8px;
			}

			.join input {
				flex: 1;
				text-transform: uppercase;
			}

			#battle {
				display: none;
			}

			.room,
			#player-label {
				margin-bottom: 12px;
				opacity: 0.75;
			}

			.creatures {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 16px;
				margin: 24px 0;
			}

			.creature {
				border: 1px solid #666;
				padding: 18px;
			}

			.creature.you {
				border-color: #fff;
			}

			.creature.active {
				outline: 2px solid #fff;
				outline-offset: 3px;
			}

			.creature-name {
				font-size: 1.1rem;
				margin: 10px 0 4px;
			}

			.stat {
				margin-top: 8px;
			}

			.ready-state {
				margin-top: 12px;
				opacity: 0.75;
			}

			#signal-toss {
				min-height: 24px;
				margin: 16px 0 6px;
				letter-spacing: 0.04em;
				opacity: 0.8;
			}

			#status {
				min-height: 24px;
				margin: 16px 0;
				font-weight: bold;
			}

			#ready {
				width: 100%;
				margin-bottom: 12px;
				font-weight: bold;
			}

			#moves {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
			}

			.move {
				text-align: left;
				min-height: 72px;
			}

			.move strong,
			.move small {
				display: block;
			}

			.move small {
				margin-top: 4px;
				opacity: 0.75;
			}

			.log {
				margin-top: 24px;
				border-top: 1px solid #444;
				padding-top: 16px;
			}

			#battle-log {
				margin: 0;
				padding-left: 20px;
				max-height: 190px;
				overflow: auto;
			}

			#battle-log li {
				margin-bottom: 6px;
			}

			@media (max-width: 600px) {
				.creatures,
				#moves {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>

	<body>
		<main>
			<section id="lobby">
				<h1>DEMONYM CONNECT</h1>

				<div class="lobby">
					<button id="create">Create Battle</button>

					<div class="join">
						<input id="room-code" type="text" maxlength="6" placeholder="Battle Code" autocomplete="off" />
						<button id="join">Join Battle</button>
					</div>
				</div>
			</section>

			<section id="battle">
				<h1>DEMONYM CONNECT</h1>

				<div class="room">
					Battle Code:
					<strong id="current-room"></strong>
				</div>

				<div id="player-label">Connecting...</div>

				<div class="creatures">
					<div id="player-1" class="creature">
						<strong>PLAYER 1</strong>
						<div id="name-1" class="creature-name">Test Creature 1</div>
						<div>Lineage: <span id="lineage-1">Husk</span></div>
						<div class="stat">HP: <span id="hp-1">100</span>/<span id="max-hp-1">100</span></div>
						<div class="stat">Energy: <span id="energy-1">6</span>/<span id="max-energy-1">10</span></div>
						<div class="ready-state" id="ready-1">Not ready</div>
					</div>

					<div id="player-2" class="creature">
						<strong>PLAYER 2</strong>
						<div id="name-2" class="creature-name">Test Creature 2</div>
						<div>Lineage: <span id="lineage-2">Wisp</span></div>
						<div class="stat">HP: <span id="hp-2">100</span>/<span id="max-hp-2">100</span></div>
						<div class="stat">Energy: <span id="energy-2">6</span>/<span id="max-energy-2">10</span></div>
						<div class="ready-state" id="ready-2">Not ready</div>
					</div>
				</div>

				<div id="signal-toss"></div>
				<div id="status">Connecting...</div>
				<button id="ready" disabled>READY</button>
				<div id="moves"></div>

				<div class="log">
					<h2>BATTLE LOG</h2>
					<ol id="battle-log"></ol>
				</div>
			</section>
		</main>

		<script>
			const lobby = document.querySelector('#lobby');
			const battle = document.querySelector('#battle');
			const createButton = document.querySelector('#create');
			const joinButton = document.querySelector('#join');
			const readyButton = document.querySelector('#ready');
			const movesContainer = document.querySelector('#moves');
			const roomInput = document.querySelector('#room-code');
			const currentRoom = document.querySelector('#current-room');
			const playerLabel = document.querySelector('#player-label');
			const signalToss = document.querySelector('#signal-toss');
			const status = document.querySelector('#status');
			const battleLog = document.querySelector('#battle-log');
			const player1Card = document.querySelector('#player-1');
			const player2Card = document.querySelector('#player-2');

			let socket = null;
			let playerNumber = null;
			let connectedPlayers = [];
			let state = null;
			let moveLibrary = {};

			function showBattle(code) {
				lobby.style.display = 'none';
				battle.style.display = 'block';
				currentRoom.textContent = code;
			}

			function setText(id, value) {
				document.querySelector(id).textContent = value;
			}

			function sendMessage(message) {
				if (!socket || socket.readyState !== WebSocket.OPEN) {
					return;
				}

				socket.send(JSON.stringify(message));
			}

			function connectToRoom(code) {
				code = code.trim().toUpperCase();

				if (!/^[A-Z2-9]{6}$/.test(code)) {
					alert('Enter a valid 6-character battle code.');
					return;
				}

				showBattle(code);

				const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
				socket = new WebSocket(`${protocol}://${location.host}/api/rooms/${code}/ws`);

				socket.addEventListener('open', () => {
					status.textContent = 'Connected.';
				});

				socket.addEventListener('message', (event) => {
					const message = JSON.parse(event.data);

					if (message.type === 'welcome') {
						playerNumber = message.player;
						state = message.state;
						connectedPlayers = message.connectedPlayers ?? [];
						moveLibrary = message.moveLibrary ?? {};

						playerLabel.textContent = `You are Player ${playerNumber}`;
						player1Card.classList.toggle('you', playerNumber === 1);
						player2Card.classList.toggle('you', playerNumber === 2);
						render();
						return;
					}

					if (message.type === 'state') {
						state = message.state;
						connectedPlayers = message.connectedPlayers ?? [];
						moveLibrary = message.moveLibrary ?? moveLibrary;
						render();
						return;
					}

					if (message.type === 'error') {
						status.textContent = message.message;
					}
				});

				socket.addEventListener('close', () => {
					readyButton.disabled = true;
					movesContainer.innerHTML = '';
					status.textContent = 'Disconnected.';
				});

				socket.addEventListener('error', () => {
					readyButton.disabled = true;
					movesContainer.innerHTML = '';
					status.textContent = 'Connection error.';
				});
			}

			function renderCreature(player) {
				const creature = state.players[player - 1];
				setText(`#name-${player}`, creature.name);
				setText(`#lineage-${player}`, creature.lineage);
				setText(`#hp-${player}`, creature.hp);
				setText(`#max-hp-${player}`, creature.maxHp);
				setText(`#energy-${player}`, creature.energy);
				setText(`#max-energy-${player}`, creature.maxEnergy);
				setText(`#ready-${player}`, state.ready[player - 1] ? 'Ready' : 'Not ready');
			}

			function renderMoves() {
				movesContainer.innerHTML = '';

				if (!playerNumber || !state) {
					return;
				}

				const creature = state.players[playerNumber - 1];
				const canAct =
					state.started &&
					state.winner === null &&
					state.turn === playerNumber &&
					connectedPlayers.includes(1) &&
					connectedPlayers.includes(2);

				for (const moveId of creature.moves) {
					const move = moveLibrary[moveId];

					if (!move) {
						continue;
					}

					const button = document.createElement('button');
					button.className = 'move';
					button.disabled = !canAct || creature.energy < move.energyCost;
					button.innerHTML = `<strong>${move.name}</strong><small>${move.damage} DMG · ${move.energyCost} EN</small><small>${move.description}</small>`;
					button.addEventListener('click', () => {
						sendMessage({
							type: 'move',
							moveId: move.id,
						});
					});

					movesContainer.append(button);
				}
			}

			function renderLog() {
				battleLog.innerHTML = '';

				for (const entry of state.log) {
					const item = document.createElement('li');
					item.textContent = entry;
					battleLog.append(item);
				}

				battleLog.scrollTop = battleLog.scrollHeight;
			}

			function render() {
				if (!state || !playerNumber) {
					return;
				}

				renderCreature(1);
				renderCreature(2);

				player1Card.classList.toggle('active', state.turn === 1 && state.winner === null);
				player2Card.classList.toggle('active', state.turn === 2 && state.winner === null);

				const bothConnected = connectedPlayers.includes(1) && connectedPlayers.includes(2);
				const playerReady = state.ready[playerNumber - 1];

				if (state.started && state.initiativeWinner) {
					signalToss.textContent = `SIGNAL TOSS: Player ${state.initiativeWinner} moves first.`;
				} else {
					signalToss.textContent = '';
				}

				readyButton.disabled = !bothConnected || playerReady || state.winner !== null;
				readyButton.textContent = playerReady ? 'READY' : 'READY';

				if (state.winner !== null) {
					status.textContent = state.winner === playerNumber ? 'You win.' : `Player ${state.winner} wins.`;
				} else if (!bothConnected) {
					status.textContent = 'Waiting for opponent...';
				} else if (!state.ready[0] || !state.ready[1]) {
					status.textContent = playerReady ? 'Ready. Waiting for opponent...' : 'Opponent connected. Press READY.';
				} else if (state.turn === playerNumber) {
					status.textContent = 'Your turn.';
				} else {
					status.textContent = `Player ${state.turn}'s turn.`;
				}

				renderMoves();
				renderLog();
			}

			createButton.addEventListener('click', async () => {
				createButton.disabled = true;

				try {
					const response = await fetch('/api/rooms', {
						method: 'POST',
					});
					const data = await response.json();
					connectToRoom(data.code);
				} finally {
					createButton.disabled = false;
				}
			});

			joinButton.addEventListener('click', () => {
				connectToRoom(roomInput.value);
			});

			roomInput.addEventListener('keydown', (event) => {
				if (event.key === 'Enter') {
					connectToRoom(roomInput.value);
				}
			});

			readyButton.addEventListener('click', () => {
				sendMessage({ type: 'ready' });
			});
		</script>
	</body>
</html>
